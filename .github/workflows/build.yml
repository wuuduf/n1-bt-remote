name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # only used by the release step on v* tags
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Lint scripts
        run: |
          bash -n build.sh
          bash -n scripts/box.sh
          python3 -m py_compile tools/*.py

      # With a KEYSTORE_B64 secret (base64 of n1remote.keystore) and KS_PASS, the APKs are
      # signed with the release key and can update installed copies. Without it a throwaway
      # key is generated: fine for testing, but those APKs won't install over release builds,
      # so tagged builds refuse to go on without the release key.
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > n1remote.keystore
            echo "signing with the release key"
          elif [ "$IS_TAG" = "true" ]; then
            echo "::error::Release tags must be signed with the release key: add the KEYSTORE_B64 and KS_PASS secrets"
            exit 1
          else
            echo "::notice::No KEYSTORE_B64 secret, signing with a throwaway key"
          fi

      - name: Build
        env:
          KS_PASS: ${{ secrets.KS_PASS || 'android' }}
        run: ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: n1-bt-remote-${{ github.sha }}
          path: dist/
          if-no-files-found: error

      # Pushing a v* tag publishes a release. Its notes are the tag's annotation
      # (git tag -a vX.Y.Z -F notes.md), followed by the checksums and a link to this run.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --depth=1 origin "+refs/tags/$TAG:refs/tags/$TAG"
          git for-each-ref "refs/tags/$TAG" --format='%(contents)' > notes.md
          {
            echo
            echo 'SHA-256:'
            echo '```'
            (cd dist && sha256sum *)
            echo '```'
            echo
            echo "Built and signed by GitHub Actions: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } >> notes.md
          gh release create "$TAG" dist/* --title "$TAG" --notes-file notes.md --verify-tag
